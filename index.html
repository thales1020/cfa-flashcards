<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CFA Level 1 — Flashcards (EN/VN)</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f6e56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CFA Flashcards">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --panel:#ffffff; --ink:#1c2826; --muted:#5a6b67;
  --line:#e2ddd2; --accent:#0f6e56; --accent-deep:#08423a; --accent-soft:#e1f0ea;
  --amber:#b07514; --amber-soft:#fbf0db;
  --known:#2f8f4f; --unknown:#c0492a;
  --hl-bg:#fbf0db; --hl-ink:#6e480c;
  --vi:#1f5d99; --note-bg:#fffdf7;
  --shadow:0 1px 2px rgba(28,40,38,.05), 0 8px 24px rgba(28,40,38,.07);
}
[data-theme="dark"]{
  --bg:#171d1b; --panel:#1f2725; --ink:#eae6dc; --muted:#a4afab;
  --line:#33403c; --accent:#4db89b; --accent-deep:#bfe6da; --accent-soft:#123a33;
  --amber:#e0b24a; --amber-soft:#3a2f15;
  --known:#5cc47a; --unknown:#e5836a;
  --hl-bg:#4a3d17; --hl-ink:#f7e6bf;
  --vi:#82b2e2; --note-bg:#232b28;
  --shadow:0 8px 24px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;-webkit-text-size-adjust:100%;}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel),var(--bg));
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);}
.hwrap{max-width:1120px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 14px max(22px,env(safe-area-inset-left,0px));}
.titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;}
.chap{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);font-weight:600;}
h1{font-family:'Playfair Display',serif;font-size:1.5rem;margin:.1rem 0 0;font-weight:700;
  letter-spacing:-.2px;color:var(--accent-deep);}
h1 span{color:var(--accent);}
.spacer{flex:1;}
.btn,.chip,.sbtn,select,input[type=search]{touch-action:manipulation;}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
  padding:8px 14px;font-size:12.5px;cursor:pointer;font-weight:600;transition:.18s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;}
input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:10px 16px;font-size:14px;outline:none;font-family:inherit;}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
  padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.topics{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.readings{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);}
.readings .chip{flex:0 0 auto;}
.chip.rd{border-color:var(--amber);color:var(--amber);}
.chip.rd:hover{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);}
.chip.rd.active{background:var(--amber);color:#fff;border-color:var(--amber);}
.notesbar{margin-top:9px;position:relative;}
.notepanel{position:absolute;top:calc(100% + 6px);left:0;right:0;
  max-height:min(280px,60vh);overflow-y:auto;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);}
.noterow{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;cursor:pointer;
  transition:.15s;text-align:left;border:none;background:none;width:100%;font-family:inherit;}
.noterow:hover{background:var(--accent-soft);}
.noterow-head{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.noterow-head b{color:var(--accent-deep);font-weight:600;}
.noterow-text{font-size:12.5px;color:var(--ink);line-height:1.5;white-space:pre-wrap;}
.notepanel .empty2{padding:16px;text-align:center;color:var(--muted);font-size:12.5px;}
@keyframes jumpFlash{0%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:none}}
.card.jump-flash .face{animation:jumpFlash 1.4s ease-out;}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
  padding:5px 13px;font-size:12px;cursor:pointer;font-weight:600;transition:.18s;}
.chip:hover{color:var(--accent-deep);border-color:var(--accent);background:var(--accent-soft);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.stats{max-width:1120px;margin:16px auto 0;padding:0 22px;display:flex;gap:14px;flex-wrap:wrap;
  font-size:13px;color:var(--muted);align-items:center;}
.bar{flex:1;min-width:160px;height:9px;border-radius:6px;background:var(--line);overflow:hidden;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#2f8f4f);width:0;transition:width .3s;}
.pill{padding:3px 12px;border-radius:999px;font-weight:600;font-size:12px;}
.pill.k{background:color-mix(in srgb,var(--known) 20%,transparent);color:var(--known);}
.pill.u{background:color-mix(in srgb,var(--unknown) 20%,transparent);color:var(--unknown);}
main{max-width:1120px;margin:0 auto;padding:22px;}
.deck{display:grid;gap:18px;align-items:start;}
.card{perspective:1800px;}
.inner{position:relative;width:100%;min-height:200px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;}
.card.flipped .inner{transform:rotateY(180deg);}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s;}
.front{position:absolute;inset:0;cursor:pointer;}
.back{position:relative;transform:rotateY(180deg);}
.card:hover .face{box-shadow:0 3px 8px rgba(28,40,38,.08),0 18px 40px rgba(28,40,38,.13);}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;color:#fff;padding:4px 10px;border-radius:999px;background:var(--accent);}
.num{font-size:11px;color:var(--muted);font-family:'Playfair Display',serif;}
.starbtn{border:none;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--muted);
  padding:2px 4px;border-radius:6px;transition:.15s;}
.starbtn:hover{color:var(--amber);background:var(--amber-soft);}
.starbtn.on{color:var(--amber);}
.hint{margin-left:auto;font-size:11px;color:var(--muted);}
.term{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;line-height:1.25;margin:auto 0;
  color:var(--accent-deep);cursor:pointer;}
.term .vi{display:block;font-family:'Be Vietnam Pro',sans-serif;font-size:1.02rem;font-weight:600;
  color:var(--vi);margin-top:8px;}
.def{font-size:15.5px;line-height:1.72;margin:2px 0 auto;cursor:text;}
.def sup,.def sub,.term sup,.term sub{font-size:.72em;line-height:0;}
.def .en{color:var(--ink);}
.def .vi{display:block;color:var(--vi);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.def mark{background:var(--hl-bg);color:var(--hl-ink);border-radius:4px;padding:.02em .16em;cursor:pointer;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:box-shadow .15s;}
.def mark:hover{box-shadow:inset 0 0 0 2px var(--amber);}
.def mark.noted{box-shadow:inset 0 -2.5px 0 var(--amber);}
.def mark.noted:hover{box-shadow:inset 0 0 0 2px var(--amber),inset 0 -2.5px 0 var(--amber);}
.selhint{font-size:11px;color:var(--muted);margin-top:10px;opacity:.85;}
.selhint b{color:var(--amber);font-weight:600;}
.hlnote{position:relative;margin-top:14px;border:1px dashed var(--amber);background:var(--note-bg);
  border-radius:12px;padding:12px 14px 10px;}
.hlnote .hltext{font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.5;}
.hlnote .hltext b{color:var(--hl-ink);background:var(--hl-bg);border-radius:4px;padding:.02em .3em;font-weight:600;}
.hlnote-ta{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;line-height:1.55;
  resize:vertical;min-height:44px;outline:none;transition:.18s;}
.hlnote-ta:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);}
.hlnote-ta::placeholder{color:var(--muted);opacity:.7;}
.hlactions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
.cardfoot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center;}
.sbtn{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;
  padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.18s;}
.sbtn:hover{border-color:var(--accent);color:var(--accent);}
.sbtn.k.on{background:var(--known);color:#fff;border-color:var(--known);}
.sbtn.u.on{background:var(--unknown);color:#fff;border-color:var(--unknown);}
.sbtn.erase{margin-left:auto;}
.sbtn.erase:hover{border-color:var(--amber);color:var(--amber);}
.notewrap{position:relative;margin-top:16px;}
.notewrap::before{content:'Ghi chú';position:absolute;top:-.68rem;left:1rem;background:var(--amber);color:#fff;
  font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.14rem .6rem;border-radius:999px;}
.note{width:100%;border:1px dashed var(--amber);background:var(--note-bg);color:var(--ink);
  border-radius:12px;padding:14px 14px 10px;font-size:13.5px;font-family:inherit;line-height:1.55;
  resize:vertical;min-height:46px;outline:none;transition:.18s;}
.note:focus{box-shadow:0 0 0 3px var(--amber-soft);}
.note::placeholder{color:var(--muted);opacity:.7;}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;}
.count{font-size:12px;color:var(--muted);}
footer{max-width:1120px;margin:0 auto;padding:14px 22px 44px;color:var(--muted);font-size:12.5px;text-align:center;
  border-top:1px solid var(--line);}
[data-lang="en"] .vi{display:none!important;}
[data-lang="vi"] .en{display:none!important;}
[data-lang="vi"] .def .vi{border-top:none;margin-top:0;padding-top:0;}

/* ---- mobile / touch tuning (≤720px) ---- */
@media(max-width:720px){
  /* 16px on form controls stops iOS Safari from auto-zooming on focus */
  input[type=search]{font-size:16px;padding:12px 16px;}
  select{font-size:16px;padding:11px 14px;}
  /* comfortable ≥44px thumb targets */
  .btn{padding:11px 15px;font-size:13px;}
  .sbtn{padding:10px 15px;font-size:13px;}
  .chip{padding:9px 15px;font-size:13px;}
  /* topic chips: one horizontal swipe strip instead of wrapped rows (readings already scroll at all sizes) */
  .topics{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .topics,.readings{scrollbar-width:none;margin-inline:-22px;padding-inline:22px;scroll-padding-left:22px;}
  .topics::-webkit-scrollbar,.readings::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;}
  /* give tapped cards a touch of breathing room */
  main{padding:16px;}
  .face{padding:20px;}
}
@media(min-width:720px){.deck{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body data-lang="both">
<header>
  <div class="hwrap">
    <div class="titlerow">
      <div class="brand"><span class="chap">Tài liệu ôn thi CFA</span><h1>CFA <span>Level&nbsp;I</span> Flashcards</h1></div>
      <span class="count" id="count"></span>
      <div class="spacer"></div>
      <button class="btn" id="lang">🌐 EN + VN</button>
      <button class="btn" id="flipall">👁 Hiện nghĩa</button>
      <button class="btn" id="shuffle">🔀 Shuffle</button>
      <button class="btn" id="reset">↺ Reset</button>
      <button class="btn" id="theme">🌙 Dark</button>
    </div>
    <div class="controls">
      <input type="search" id="search" placeholder="Search EN or VN… / Tìm thuật ngữ…">
      <select id="filterStatus">
        <option value="all">All cards</option>
        <option value="unknown">Still learning</option>
        <option value="known">Known</option>
        <option value="unseen">Unmarked</option>
        <option value="noted">With notes</option>
        <option value="starred">★ Starred</option>
      </select>
    </div>
    <div class="topics" id="topics"></div>
    <div class="readings" id="readings" style="display:none"></div>
    <div class="notesbar">
      <button class="btn" id="notesToggle">📝 Ghi chú <span id="notesCount">(0)</span></button>
      <div class="notepanel" id="notepanel" style="display:none"></div>
    </div>
  </div>
</header>

<div class="stats">
  <span class="pill k" id="pk">Known 0</span>
  <span class="pill u" id="pu">Learning 0</span>
  <div class="bar"><i id="barfill"></i></div>
  <span id="pct">0%</span>
</div>

<main>
  <div class="deck" id="deck"></div>
  <div class="empty" id="empty" style="display:none">No cards match. / Không có thẻ phù hợp.</div>
</main>
<footer>
  Tap a card to flip · Mark Known/Learning · Highlight · Add notes — all saved in your browser. &nbsp;|&nbsp; Nhấn thẻ để lật · English + Tiếng Việt · CFA Level I.
</footer>

<script>
/* ============ APP ============ */
const KEY='cfa_l1_flash_v2';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let cards=[], order=[], currentReadings=[];
const topicColors={};
const palette=['#0f6e56','#b07514','#b6442a','#6b3d6e','#1f5d99','#2f8f4f','#08423a','#9d3a1e','#4d2950','#15395e'];
let allTopics=['All'];

const $=s=>document.querySelector(s);
const deck=$('#deck'), topicsEl=$('#topics'), readingsEl=$('#readings');
const UIK='cfa_l1_ui_v2';
const ui=JSON.parse(localStorage.getItem(UIK)||'{}');
let activeTopic=ui.topic||'All', activeReading=ui.reading||'All', q=ui.q||'', statusFilter=ui.status||'all';
let allFlipped=false;
function saveUI(){localStorage.setItem(UIK,JSON.stringify({topic:activeTopic,reading:activeReading,q,status:statusFilter}));}
const langCycle=['both','en','vi']; const langLabel={both:'\U0001F310 EN + VN',en:'\U0001F1EC\U0001F1E7 EN only',vi:'\U0001F1FB\U0001F1F3 VN only'};

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function st(cid){return state[cid]||{};}
function shortTopic(t){return t.replace('Financial Statement Analysis','FSA').replace('Ethics & Professional Standards','Ethics').replace('Alternative Investments','Alternatives').replace('Quantitative Methods','Quant').replace('Portfolio Management','Portfolio Mgmt');}

function renderTopics(){
  topicsEl.innerHTML=allTopics.map(t=>`<span class="chip${t===activeTopic?' active':''}" data-t="${t}">${t==='All'?'All topics':shortTopic(t)}</span>`).join('');
  topicsEl.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    topicsEl.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    ch.classList.add('active'); activeTopic=ch.dataset.t; activeReading='All'; saveUI();
    renderReadings(); render();
  });
}
function renderReadings(){
  if(activeTopic==='All'){ readingsEl.style.display='none'; readingsEl.innerHTML=''; return; }
  currentReadings=[...new Set(cards.filter(c=>c.topic===activeTopic&&c.reading).map(c=>c.reading))];
  if(!currentReadings.length){ readingsEl.style.display='none'; readingsEl.innerHTML=''; return; }
  const opts=['All',...currentReadings];
  readingsEl.style.display='';
  readingsEl.innerHTML=opts.map((r,i)=>`<span class="chip rd${r===activeReading?' active':''}" data-ri="${i}">${r==='All'?'T\u1EA5t c\u1EA3 readings':esc(r)}</span>`).join('');
  readingsEl.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    const i=+ch.dataset.ri; activeReading=i===0?'All':currentReadings[i-1];
    saveUI(); renderReadings(); render();
  });
}
function migrateV1(){
  if(Object.keys(state).length) return;
  let old={}; try{ old=JSON.parse(localStorage.getItem('cfa_l1_flash_v1')||'{}'); }catch(e){}
  const keys=Object.keys(old); if(!keys.length) return;
  keys.forEach(k=>{ const i=+k; if(Number.isInteger(i)&&cards[i]) state[cards[i].id]=old[k]; });
  save();
}
function boot(){
  fetch('data.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(data=>{
    let idx=0;
    (data.topics||[]).forEach((tp,ti)=>{
      topicColors[tp.name]=palette[ti%palette.length];
      allTopics.push(tp.name);
      (tp.cards||[]).forEach(cd=>{ cards.push({id:cd.id,topic:tp.name,reading:cd.reading||null,en:cd.en,ed:cd.ed,vn:cd.vn,vd:cd.vd,num:idx+1}); idx++; });
    });
    order=cards.map((_,i)=>i);
    migrateV1();
    if(activeTopic!=='All'&&!allTopics.includes(activeTopic)){ activeTopic='All'; activeReading='All'; }
    renderTopics(); renderReadings(); render();
  })
  .catch(err=>{
    deck.innerHTML='<div class="empty">Kh\u00f4ng t\u1EA3i \u0111\u01B0\u1EE3c d\u1EEF li\u1EC7u th\u1EBB (<code>data.json</code>).<br>N\u1EBFu m\u1EDF b\u1EB1ng <code>file://</code>, h\u00E3y ch\u1EA1y qua GitHub Pages ho\u1EB7c m\u1ED9t local server.<br><small>'+esc(String(err&&err.message||err))+'</small></div>';
  });
}

function filtered(){
  return order.map(i=>cards[i]).filter(c=>{
    if(activeTopic!=='All' && c.topic!==activeTopic) return false;
    if(activeTopic!=='All' && activeReading!=='All' && c.reading!==activeReading) return false;
    if(q){const s=(c.en+' '+c.ed+' '+c.vn+' '+c.vd).toLowerCase(); if(!s.includes(q)) return false;}
    const s=st(c.id);
    if(statusFilter==='known'&&s.s!=='k') return false;
    if(statusFilter==='unknown'&&s.s!=='u') return false;
    if(statusFilter==='unseen'&&s.s) return false;
    if(statusFilter==='noted'&&!(s.n&&s.n.trim())) return false;
    if(statusFilter==='starred'&&!s.fl) return false;
    return true;
  });
}

/* ----- highlight helpers -----
   each highlight is {s,e,n}: char range [s,e) into the raw ed/vd text, plus its own note (n).
   ranges never overlap (a new selection that overlaps an existing one opens that one's note instead). */
function hlHTML(text,list){
  const items=list.map((h,i)=>({...h,_i:i})).sort((a,b)=>a.s-b.s);
  if(!items.length) return fmtMath(esc(text));
  let out='',i=0;
  for(const h of items){
    if(h.s>i) out+=fmtMath(esc(text.slice(i,h.s)));
    const noted=h.n&&h.n.trim()?' noted':'';
    out+='<mark data-idx="'+h._i+'" class="'+noted.trim()+'" title="Bấm để xem/sửa ghi chú">'+fmtMath(esc(text.slice(h.s,h.e)))+'</mark>';
    i=h.e;
  }
  if(i<text.length) out+=fmtMath(esc(text.slice(i)));
  return out;
}
// render formula notation: x^(a) / x^n -> superscript, x_(a) / x_i -> subscript
function fmtMath(html){
  const strip=g=>(g[0]==='('&&g[g.length-1]===')')?g.slice(1,-1):g;
  return html
    .replace(/\^(\([^()]*\)|[A-Za-z0-9+\-−]+)/g,(m,g)=>'<sup>'+strip(g)+'</sup>')
    .replace(/_(\([^()]*\)|[A-Za-z0-9+\-−]+)/g,(m,g)=>'<sub>'+strip(g)+'</sub>');
}
function spanOffset(span,node,off){
  const w=document.createTreeWalker(span,NodeFilter.SHOW_TEXT);let total=0,n;
  while((n=w.nextNode())){ if(n===node) return total+off; total+=n.nodeValue.length; }
  return total;
}
function normHL(arr){
  return (arr||[]).map(x=>Array.isArray(x)?{s:x[0],e:x[1],n:''}:{s:x.s,e:x.e,n:x.n||''});
}
function getHL(cid){const h=(state[cid]||{}).hl;return {en:normHL(h&&h.en),vi:normHL(h&&h.vi)};}
function setHL(cid,hl){const cur=state[cid]||{};state[cid]={...cur,hl};save();}

function render(){
  const list=filtered();
  deck.innerHTML='';
  $('#empty').style.display=list.length?'none':'block';
  list.forEach(c=>{
    const s=st(c.id);
    const col=topicColors[c.topic];
    const el=document.createElement('div');
    el.className='card'+(allFlipped?' flipped':'');
    el.dataset.cid=c.id;
    el.innerHTML=`
      <div class="inner">
        <div class="face front">
          <div class="meta"><span class="tag" style="background:${col}">${shortTopic(c.topic)}</span><span class="num">#${c.num}</span><button class="starbtn${s.fl?' on':''}" title="Đánh dấu">${s.fl?'★':'☆'}</button><span class="hint">tap to flip ↻</span></div>
          <div class="term"><span class="en">${fmtMath(esc(c.en))}</span><span class="vi">${fmtMath(esc(c.vn))}</span></div>
        </div>
        <div class="face back">
          <div class="meta"><span class="tag" style="background:${col}">${shortTopic(c.topic)}</span><button class="starbtn${s.fl?' on':''}" title="Đánh dấu">${s.fl?'★':'☆'}</button><span class="hint">tap to flip ↻</span></div>
          <div class="def"><span class="en"></span><span class="vi"></span></div>
          <div class="selhint">Bôi đen một đoạn để <b>tô sáng</b> · bấm vào chỗ đã tô để ghi chú</div>
          <div class="hlnote" data-stop style="display:none"></div>
          <div class="cardfoot" data-stop>
            <button class="sbtn k${s.s==='k'?' on':''}" data-act="k">✓ Known</button>
            <button class="sbtn u${s.s==='u'?' on':''}" data-act="u">↻ Learning</button>
            <button class="sbtn erase" data-act="clr">🧽 Xoá tô sáng</button>
          </div>
          <div class="notewrap" data-stop><textarea class="note" placeholder="Ghi chú / Add a note…">${s.n?esc(s.n):''}</textarea></div>
        </div>
      </div>`;
    const enSpan=el.querySelector('.def .en'), viSpan=el.querySelector('.def .vi');
    const hlnoteEl=el.querySelector('.hlnote');
    function paint(){const hl=getHL(c.id);
      enSpan.innerHTML = hlHTML(c.ed,hl.en);
      viSpan.innerHTML = hlHTML(c.vd,hl.vi);}
    paint();

    // per-highlight note editor
    let activeHL=null; // {lang, idx}
    function closeHLNote(){ activeHL=null; hlnoteEl.style.display='none'; hlnoteEl.innerHTML=''; }
    function openHLNote(lang,idx){
      const hl=getHL(c.id), item=hl[lang][idx];
      if(!item) return;
      activeHL={lang,idx};
      const srcText=lang==='en'?c.ed:c.vd;
      hlnoteEl.style.display='';
      hlnoteEl.innerHTML=`
        <div class="hltext">Ghi chú cho: <b>${esc(srcText.slice(item.s,item.e))}</b></div>
        <textarea class="hlnote-ta" placeholder="Ghi chú cho đoạn tô sáng này…">${esc(item.n||'')}</textarea>
        <div class="hlactions">
          <button class="sbtn erase" data-hl-del type="button">🗑 Xoá tô sáng</button>
          <button class="sbtn" data-hl-close type="button">Đóng</button>
        </div>`;
      const ta=hlnoteEl.querySelector('.hlnote-ta');
      ta.addEventListener('input',()=>{
        const cur=getHL(c.id); if(!cur[lang][idx]) return;
        cur[lang][idx].n=ta.value; setHL(c.id,{en:cur.en,vi:cur.vi}); refreshNotesBar();
      });
      hlnoteEl.querySelector('[data-hl-del]').onclick=ev=>{
        ev.stopPropagation();
        const cur=getHL(c.id); cur[lang].splice(idx,1); setHL(c.id,{en:cur.en,vi:cur.vi});
        closeHLNote(); paint(); refreshNotesBar();
      };
      hlnoteEl.querySelector('[data-hl-close]').onclick=ev=>{ ev.stopPropagation(); closeHLNote(); };
      ta.focus();
    }

    // flip only on genuine tap (not drag / text-selection / interactive area)
    const inner=el.querySelector('.inner');
    inner.addEventListener('mousedown',e=>{el._dx=e.clientX;el._dy=e.clientY;});
    inner.addEventListener('click',ev=>{
      if(el._sup){el._sup=false;return;}
      if(ev.target.closest('[data-stop]')||ev.target.closest('mark')) return;
      const sel=window.getSelection();
      if(sel&&sel.toString().length>0) return;
      const dx=Math.abs(ev.clientX-(el._dx??ev.clientX)), dy=Math.abs(ev.clientY-(el._dy??ev.clientY));
      if(dx>6||dy>6) return;
      el.classList.toggle('flipped');
    });

    // select-to-highlight (a selection overlapping an existing highlight opens its note instead of adding a new one)
    function addSel(span,lang){
      const sel=window.getSelection();
      if(!sel||sel.rangeCount===0||sel.isCollapsed) return false;
      const r=sel.getRangeAt(0);
      if(!span.contains(r.startContainer)||!span.contains(r.endContainer)) return false;
      let a=spanOffset(span,r.startContainer,r.startOffset), b=spanOffset(span,r.endContainer,r.endOffset);
      if(a>b)[a,b]=[b,a];
      if(b-a<1) return false;
      sel.removeAllRanges();
      const hl=getHL(c.id), list=hl[lang];
      const overlapIdx=list.findIndex(h=>a<h.e && h.s<b);
      if(overlapIdx>=0){ openHLNote(lang,overlapIdx); return true; }
      list.push({s:a,e:b,n:''});
      setHL(c.id,{en:hl.en,vi:hl.vi});
      paint(); openHLNote(lang,list.length-1); return true;
    }
    enSpan.addEventListener('mouseup',()=>{ if(addSel(enSpan,'en')) el._sup=true; });
    viSpan.addEventListener('mouseup',()=>{ if(addSel(viSpan,'vi')) el._sup=true; });
    // touch: selection settles after the touchend event, so defer a tick before reading it
    enSpan.addEventListener('touchend',()=>setTimeout(()=>{ if(addSel(enSpan,'en')) el._sup=true; },0));
    viSpan.addEventListener('touchend',()=>setTimeout(()=>{ if(addSel(viSpan,'vi')) el._sup=true; },0));
    el.querySelector('.def').addEventListener('click',ev=>{
      const m=ev.target.closest('mark'); if(!m) return;
      ev.stopPropagation(); el._sup=true;
      const span=m.parentElement, lang=span.classList.contains('en')?'en':'vi';
      const idx=+m.dataset.idx;
      if(activeHL&&activeHL.lang===lang&&activeHL.idx===idx) closeHLNote();
      else openHLNote(lang,idx);
    });

    el.querySelectorAll('.starbtn').forEach(btn=>btn.onclick=e=>{
      e.stopPropagation();
      const cur=st(c.id), ns={...cur,fl:!cur.fl};
      state[c.id]=ns; save(); updateStats();
      el.querySelectorAll('.starbtn').forEach(b=>{ b.classList.toggle('on',ns.fl); b.textContent=ns.fl?'★':'☆'; });
      if(statusFilter==='starred') render();
    });

    el.querySelectorAll('.sbtn').forEach(btn=>btn.onclick=e=>{
      e.stopPropagation();
      const a=btn.dataset.act, cur=st(c.id), ns={...cur};
      if(a==='clr'){ setHL(c.id,{en:[],vi:[]}); closeHLNote(); paint(); refreshNotesBar(); return; }
      if(a==='k') ns.s=ns.s==='k'?null:'k';
      if(a==='u') ns.s=ns.s==='u'?null:'u';
      state[c.id]=ns; save(); updateStats();
      btn.parentElement.querySelector('.k').classList.toggle('on',ns.s==='k');
      btn.parentElement.querySelector('.u').classList.toggle('on',ns.s==='u');
      if(statusFilter!=='all') render();
    });
    const ta=el.querySelector('.note');
    ta.addEventListener('input',()=>{const cur=st(c.id);state[c.id]={...cur,n:ta.value};save();refreshNotesBar();});
    deck.appendChild(el);
  });
  $('#count').textContent=`${list.length} / ${cards.length} cards`;
  updateStats();
  refreshNotesBar();
}

function updateStats(){
  let k=0,u=0;
  cards.forEach(c=>{const s=st(c.id).s; if(s==='k')k++; else if(s==='u')u++;});
  $('#pk').textContent='Known '+k;
  $('#pu').textContent='Learning '+u;
  const pct=Math.round(k/cards.length*100);
  $('#barfill').style.width=pct+'%';
  $('#pct').textContent=pct+'%';
}

/* ----- notes toolbar: lists every card-note and highlight-note in the active topic, click to jump ----- */
function collectNotes(){
  const scope=activeTopic==='All'?cards:cards.filter(c=>c.topic===activeTopic);
  const out=[];
  scope.forEach(c=>{
    const s=st(c.id);
    if(s.n&&s.n.trim()) out.push({cid:c.id,type:'card',text:s.n.trim(),term:c.en});
    const hl=getHL(c.id);
    hl.en.forEach(h=>{ if(h.n&&h.n.trim()) out.push({cid:c.id,type:'hl',text:h.n.trim(),term:c.en}); });
    hl.vi.forEach(h=>{ if(h.n&&h.n.trim()) out.push({cid:c.id,type:'hl',text:h.n.trim(),term:c.en}); });
  });
  return out;
}
function refreshNotesBar(){
  const notes=collectNotes();
  $('#notesCount').textContent='('+notes.length+')';
  const panel=$('#notepanel');
  if(panel.style.display==='none') return;
  if(!notes.length){
    panel.innerHTML='<div class="empty2">Chưa có ghi chú nào trong '+(activeTopic==='All'?'bộ thẻ':'môn này')+'.</div>';
    return;
  }
  panel.innerHTML=notes.map(nt=>`
    <button class="noterow" data-cid="${nt.cid}">
      <div class="noterow-head">${nt.type==='hl'?'🖍️':'📝'} <b>${esc(nt.term)}</b></div>
      <div class="noterow-text">${esc(nt.text.length>140?nt.text.slice(0,140)+'…':nt.text)}</div>
    </button>`).join('');
  panel.querySelectorAll('.noterow').forEach(row=>row.onclick=()=>jumpToCard(row.dataset.cid));
}
function jumpToCard(cid){
  const c=cards.find(x=>x.id===cid); if(!c) return;
  $('#notepanel').style.display='none';
  activeTopic=c.topic; activeReading=c.reading||'All'; q=''; statusFilter='all';
  searchEl.value=''; filterEl.value='all';
  saveUI(); renderTopics(); renderReadings(); render();
  requestAnimationFrame(()=>{
    const card=deck.querySelector('.card[data-cid="'+cid+'"]');
    if(!card) return;
    card.classList.add('flipped');
    card.scrollIntoView({behavior:'smooth',block:'center'});
    card.classList.add('jump-flash');
    setTimeout(()=>card.classList.remove('jump-flash'),1500);
  });
}
$('#notesToggle').onclick=e=>{
  e.stopPropagation();
  const panel=$('#notepanel');
  panel.style.display = panel.style.display==='none' ? '' : 'none';
  refreshNotesBar();
};
document.addEventListener('click',ev=>{
  const bar=document.querySelector('.notesbar'), panel=$('#notepanel');
  if(panel.style.display!=='none' && bar && !bar.contains(ev.target)) panel.style.display='none';
});

function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

const searchEl=$('#search'); searchEl.value=q;
searchEl.addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();saveUI();render();});
const filterEl=$('#filterStatus'); filterEl.value=statusFilter;
filterEl.addEventListener('change',e=>{statusFilter=e.target.value;saveUI();render();});
$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}render();};
$('#reset').onclick=()=>{if(confirm('Xoá toàn bộ tiến độ, ghi chú và tô sáng? / Clear all progress, notes and highlights?')){state={};save();render();}};
$('#flipall').onclick=()=>{allFlipped=!allFlipped;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('flipped',allFlipped));
  $('#flipall').textContent=allFlipped?'🙈 Ẩn nghĩa':'👁 Hiện nghĩa';};

// language toggle
let langIdx=parseInt(localStorage.getItem('cfa_lang_idx')||'0');
function applyLang(){const m=langCycle[langIdx];document.body.setAttribute('data-lang',m);$('#lang').textContent=langLabel[m];}
$('#lang').onclick=()=>{langIdx=(langIdx+1)%langCycle.length;localStorage.setItem('cfa_lang_idx',langIdx);applyLang();};
applyLang();

// theme
const savedTheme=localStorage.getItem('cfa_theme')||'light';
if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');$('#theme').textContent='☀️ Light';}
$('#theme').onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark){document.documentElement.removeAttribute('data-theme');$('#theme').textContent='🌙 Dark';localStorage.setItem('cfa_theme','light');}
  else{document.documentElement.setAttribute('data-theme','dark');$('#theme').textContent='☀️ Light';localStorage.setItem('cfa_theme','dark');}
};

boot();
</script>
