["Pooled investment vehicles","Mutual funds, ETFs, and closed-end funds that combine investor capital; ETFs trade intraday and are often tax-efficient.","Các quỹ đầu tư gộp vốn","Quỹ tương hỗ, ETF và quỹ đóng gộp vốn của nhà đầu tư; ETF giao dịch trong ngày và thường hiệu quả về thuế."],
["Risk management process","Identifying, measuring, and modifying exposures relative to risk tolerance through governance and appropriate tools.","Quy trình quản trị rủi ro","Xác định, đo lường và điều chỉnh mức phơi nhiễm so với mức chịu rủi ro thông qua quản trị và các công cụ phù hợp."],
["Fintech in investment management","Technologies (big data, AI, robo-advisers, blockchain) reshaping analysis, trading, and portfolio management.","Fintech trong quản lý đầu tư","Các công nghệ (dữ liệu lớn, AI, cố vấn robot, blockchain) định hình lại phân tích, giao dịch và quản lý danh mục."]
],
"Ethics & Professional Standards":[
["Code of Ethics","CFA Institute's set of ethical principles requiring members to act with integrity, competence, and respect for the profession and clients.","Quy tắc đạo đức","Bộ nguyên tắc đạo đức của Viện CFA yêu cầu thành viên hành động chính trực, năng lực và tôn trọng nghề nghiệp lẫn khách hàng."],
["Standards of Professional Conduct","Seven standards operationalizing the Code, covering professionalism, markets, client duties, employer duties, analysis, conflicts, and program conduct.","Các chuẩn mực ứng xử nghề nghiệp","Bảy chuẩn mực cụ thể hóa Quy tắc, bao gồm tính chuyên nghiệp, thị trường, nghĩa vụ với khách hàng, với chủ lao động, phân tích, xung đột và ứng xử trong chương trình."],
["Standard I: Professionalism","Requires knowledge of the law, independence and objectivity, no misrepresentation, and no misconduct reflecting on integrity.","Chuẩn mực I: Tính chuyên nghiệp","Yêu cầu hiểu biết pháp luật, độc lập và khách quan, không xuyên tạc và không có hành vi sai trái ảnh hưởng đến sự chính trực."],
["Independence and objectivity","Members must maintain independence and objectivity, avoiding gifts or pressures that could compromise their judgment.","Độc lập và khách quan","Thành viên phải giữ tính độc lập và khách quan, tránh quà tặng hay áp lực có thể làm tổn hại phán đoán."],
["Misrepresentation","Prohibits any untrue statement or omission of fact in investment analysis, recommendations, or performance; includes plagiarism.","Xuyên tạc","Cấm mọi phát biểu sai sự thật hoặc bỏ sót sự kiện trong phân tích, khuyến nghị hay hiệu suất đầu tư; bao gồm cả đạo văn."],
["Standard II: Integrity of capital markets","Prohibits acting on material nonpublic information (insider trading) and market manipulation.","Chuẩn mực II: Toàn vẹn thị trường vốn","Cấm hành động dựa trên thông tin trọng yếu chưa công bố (giao dịch nội gián) và thao túng thị trường."],
["Material nonpublic information","Information likely to affect a security's price that has not been disseminated; trading on it violates the Standards (mosaic theory is permitted).","Thông tin trọng yếu chưa công bố","Thông tin có khả năng ảnh hưởng giá chứng khoán mà chưa được công bố; giao dịch dựa trên nó vi phạm chuẩn mực (lý thuyết ghép mảnh được phép)."],
["Mosaic theory","Reaching investment conclusions by combining public and nonmaterial-nonpublic information; this does not violate the Standards.","Lý thuyết ghép mảnh (mosaic)","Đưa ra kết luận đầu tư bằng cách kết hợp thông tin công khai và thông tin phi trọng yếu chưa công bố; điều này không vi phạm chuẩn mực."],
["Market manipulation","Prohibited practices that distort prices or trading volume to mislead participants, including transaction- and information-based manipulation.","Thao túng thị trường","Các hành vi bị cấm làm sai lệch giá hoặc khối lượng giao dịch nhằm đánh lừa người tham gia, gồm thao túng qua giao dịch và qua thông tin."],
["Standard III: Duties to clients","Requires loyalty, prudence, and care; fair dealing; suitability; performance presentation; and confidentiality.","Chuẩn mực III: Nghĩa vụ với khách hàng","Yêu cầu trung thành, thận trọng và cẩn trọng; đối xử công bằng; tính phù hợp; trình bày hiệu suất; và bảo mật."],
["Loyalty, prudence, and care","Members must place client interests first, act with the care of a prudent person, and manage assets per the client's mandate.","Trung thành, thận trọng và cẩn trọng","Thành viên phải đặt lợi ích khách hàng lên trên, hành động cẩn trọng như người thận trọng và quản lý tài sản theo ủy thác của khách hàng."],
["Fair dealing","Members must treat all clients fairly when disseminating recommendations or taking investment action — not favoring some over others.","Đối xử công bằng","Thành viên phải đối xử công bằng với mọi khách hàng khi phổ biến khuyến nghị hoặc thực hiện hành động đầu tư — không thiên vị ai."],
["Suitability","Recommendations must fit the client's financial situation, objectives, constraints, and risk profile as set out in the IPS.","Tính phù hợp","Khuyến nghị phải phù hợp với tình hình tài chính, mục tiêu, ràng buộc và hồ sơ rủi ro của khách hàng như nêu trong IPS."],
["Performance presentation","Communications about performance must be fair, accurate, and complete, without misleading or cherry-picked results.","Trình bày hiệu suất","Thông tin về hiệu suất phải công bằng, chính xác và đầy đủ, không gây hiểu lầm hay chọn lọc kết quả có lợi."],
["Preservation of confidentiality","Members must keep client information confidential unless disclosure is required by law, permitted by the client, or concerns illegal activities.","Bảo mật thông tin","Thành viên phải giữ bí mật thông tin khách hàng trừ khi pháp luật yêu cầu tiết lộ, khách hàng cho phép, hoặc liên quan hoạt động bất hợp pháp."],
["Standard IV: Duties to employers","Requires loyalty to the employer, arrangement for additional compensation only with consent, and responsibilities of supervisors.","Chuẩn mực IV: Nghĩa vụ với chủ lao động","Yêu cầu trung thành với chủ lao động, chỉ nhận thù lao thêm khi có sự đồng ý, và trách nhiệm của người giám sát."],
["Loyalty to employer","Members must act for their employer's benefit, not deprive it of their skills, and not harm it before or after leaving.","Trung thành với chủ lao động","Thành viên phải hành động vì lợi ích của chủ lao động, không tước đi kỹ năng của họ, và không gây hại trước hoặc sau khi nghỉ việc."],
["Additional compensation arrangements","Members must obtain written consent from all parties before accepting outside compensation that competes with the employer's interest.","Thỏa thuận thù lao bổ sung","Thành viên phải có sự đồng ý bằng văn bản của tất cả các bên trước khi nhận thù lao bên ngoài cạnh tranh với lợi ích của chủ lao động."],
["Responsibilities of supervisors","Members in supervisory roles must make reasonable efforts to detect and prevent violations by those under their supervision.","Trách nhiệm của người giám sát","Thành viên ở vai trò giám sát phải nỗ lực hợp lý để phát hiện và ngăn chặn vi phạm của những người dưới quyền."],
["Standard V: Investment analysis & recommendations","Requires diligence and reasonable basis, clear communication, and retention of records supporting analysis.","Chuẩn mực V: Phân tích và khuyến nghị đầu tư","Yêu cầu sự cần mẫn và cơ sở hợp lý, truyền đạt rõ ràng, và lưu giữ hồ sơ hỗ trợ phân tích."],
["Diligence and reasonable basis","Investment actions must rest on thorough research and a reasonable, adequate basis supported by appropriate diligence.","Cần mẫn và cơ sở hợp lý","Hành động đầu tư phải dựa trên nghiên cứu kỹ lưỡng và cơ sở hợp lý, đầy đủ, được hỗ trợ bằng sự cần mẫn phù hợp."],
["Communication with clients","Members must distinguish fact from opinion, disclose the investment process and its risks, and identify material limitations.","Truyền đạt với khách hàng","Thành viên phải phân biệt sự kiện với ý kiến, công bố quy trình đầu tư và rủi ro của nó, và nêu rõ các giới hạn trọng yếu."],
["Record retention","Members must keep records supporting their analyses, recommendations, and actions; records are the firm's property.","Lưu giữ hồ sơ","Thành viên phải lưu giữ hồ sơ hỗ trợ phân tích, khuyến nghị và hành động; hồ sơ là tài sản của công ty."],
["Standard VI: Conflicts of interest","Requires full disclosure of conflicts, priority of client transactions over personal ones, and disclosure of referral fees.","Chuẩn mực VI: Xung đột lợi ích","Yêu cầu công bố đầy đủ xung đột, ưu tiên giao dịch của khách hàng hơn cá nhân, và công bố phí giới thiệu."],
["Priority of transactions","Client and employer transactions take precedence over a member's personal (beneficial-ownership) transactions.","Ưu tiên giao dịch","Giao dịch của khách hàng và chủ lao động được ưu tiên hơn giao dịch cá nhân (sở hữu hưởng lợi) của thành viên."],
["Standard VII: Responsibilities as a member/candidate","Prohibits conduct compromising the CFA Program's integrity and misrepresenting the CFA designation.","Chuẩn mực VII: Trách nhiệm của thành viên/thí sinh","Cấm hành vi làm tổn hại tính toàn vẹn của Chương trình CFA và xuyên tạc về danh hiệu CFA."],
["Global Investment Performance Standards (GIPS)","Voluntary ethical standards for calculating and presenting investment performance to ensure fair representation and full disclosure.","Chuẩn GIPS","Bộ chuẩn mực đạo đức tự nguyện về tính toán và trình bày hiệu suất đầu tư nhằm đảm bảo trình bày công bằng và công bố đầy đủ."]
]
};

/* ============ APP ============ */
const KEY='cfa_l1_flash_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let cards=[]; let id=0;
const topicColors={};
const palette=['#0f6e56','#b07514','#b6442a','#6b3d6e','#1f5d99','#2f8f4f','#08423a','#9d3a1e','#4d2950','#15395e'];
Object.keys(DATA).forEach((t,i)=>{topicColors[t]=palette[i%palette.length];});
for(const topic in DATA){DATA[topic].forEach(([en,ed,vn,vd])=>{cards.push({id:id++,topic,en,ed,vn,vd});});}
let order=cards.map(c=>c.id);

const $=s=>document.querySelector(s);
const deck=$('#deck'), topicsEl=$('#topics');
const UIK='cfa_l1_ui_v1';
const ui=JSON.parse(localStorage.getItem(UIK)||'{}');
let activeTopic=ui.topic||'All', q=ui.q||'', statusFilter=ui.status||'all';
let allFlipped=false;
function saveUI(){localStorage.setItem(UIK,JSON.stringify({topic:activeTopic,q,status:statusFilter}));}
const langCycle=['both','en','vi']; const langLabel={both:'🌐 EN + VN',en:'🇬🇧 EN only',vi:'🇻🇳 VN only'};

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function st(cid){return state[cid]||{};}

const allTopics=['All',...Object.keys(DATA)];
function shortTopic(t){return t.replace('Financial Statement Analysis','FSA').replace('Ethics & Professional Standards','Ethics').replace('Alternative Investments','Alternatives').replace('Quantitative Methods','Quant').replace('Portfolio Management','Portfolio Mgmt');}
topicsEl.innerHTML=allTopics.map(t=>`<span class="chip${t===activeTopic?' active':''}" data-t="${t}">${t==='All'?'All topics':shortTopic(t)}</span>`).join('');
topicsEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  topicsEl.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); activeTopic=c.dataset.t; saveUI(); render();
});

function filtered(){
  return order.map(i=>cards[i]).filter(c=>{
    if(activeTopic!=='All' && c.topic!==activeTopic) return false;
    if(q){const s=(c.en+' '+c.ed+' '+c.vn+' '+c.vd).toLowerCase(); if(!s.includes(q)) return false;}
    const s=st(c.id);
    if(statusFilter==='known'&&s.s!=='k') return false;
    if(statusFilter==='unknown'&&s.s!=='u') return false;
    if(statusFilter==='unseen'&&s.s) return false;
    if(statusFilter==='noted'&&!(s.n&&s.n.trim())) return false;
    return true;
  });
}

/* ----- highlight helpers ----- */
function mergeRanges(rs){
  if(!rs||!rs.length) return [];
  rs=rs.map(r=>[Math.min(r[0],r[1]),Math.max(r[0],r[1])]).sort((a,b)=>a[0]-b[0]);
  const out=[rs[0].slice()];
  for(let i=1;i<rs.length;i++){const last=out[out.length-1];
    if(rs[i][0]<=last[1]) last[1]=Math.max(last[1],rs[i][1]); else out.push(rs[i].slice());}
  return out;
}
function hlHTML(text,ranges){
  ranges=mergeRanges(ranges);
  if(!ranges.length) return esc(text);
  let out='',i=0;
  for(const [s,e] of ranges){
    if(s>i) out+=esc(text.slice(i,s));
    out+='<mark data-s="'+s+'" data-e="'+e+'" title="Bấm để xoá tô sáng">'+esc(text.slice(s,e))+'</mark>';
    i=e;
  }
  out+=esc(text.slice(i));
  return out;
}
function spanOffset(span,node,off){
  const w=document.createTreeWalker(span,NodeFilter.SHOW_TEXT);let total=0,n;
  while((n=w.nextNode())){ if(n===node) return total+off; total+=n.nodeValue.length; }
  return total;
}
function getHL(cid){const h=(state[cid]||{}).hl;return {en:(h&&h.en)?h.en.slice():[],vi:(h&&h.vi)?h.vi.slice():[]};}
function setHL(cid,hl){const cur=state[cid]||{};state[cid]={...cur,hl};save();}

function render(){
  const list=filtered();
  deck.innerHTML='';
  $('#empty').style.display=list.length?'none':'block';
  list.forEach(c=>{
    const s=st(c.id);
    const col=topicColors[c.topic];
    const el=document.createElement('div');
    el.className='card'+(allFlipped?' flipped':'');
    el.innerHTML=`
      <div class="inner">
        <div class="face front">
          <div class="meta"><span class="tag" style="background:${col}">${shortTopic(c.topic)}</span><span class="num">#${c.id+1}</span><span class="hint">tap to flip ↻</span></div>
          <div class="term"><span class="en">${esc(c.en)}</span><span class="vi">${esc(c.vn)}</span></div>
        </div>
        <div class="face back">
          <div class="meta"><span class="tag" style="background:${col}">${shortTopic(c.topic)}</span><span class="hint">tap to flip ↻</span></div>
          <div class="def"><span class="en"></span><span class="vi"></span></div>
          <div class="selhint">Bôi đen một đoạn để <b>tô sáng</b> · bấm vào chỗ đã tô để xoá</div>
          <div class="cardfoot" data-stop>
            <button class="sbtn k${s.s==='k'?' on':''}" data-act="k">✓ Known</button>
            <button class="sbtn u${s.s==='u'?' on':''}" data-act="u">↻ Learning</button>
            <button class="sbtn erase" data-act="clr">🧽 Xoá tô sáng</button>
          </div>
          <div class="notewrap" data-stop><textarea class="note" placeholder="Ghi chú / Add a note…">${s.n?esc(s.n):''}</textarea></div>
        </div>
      </div>`;
    const enSpan=el.querySelector('.def .en'), viSpan=el.querySelector('.def .vi');
    function paint(){const hl=getHL(c.id);enSpan.innerHTML=hlHTML(c.ed,hl.en);viSpan.innerHTML=hlHTML(c.vd,hl.vi);}
    paint();

    // flip only on genuine tap (not drag / text-selection / interactive area)
    const inner=el.querySelector('.inner');
    inner.addEventListener('mousedown',e=>{el._dx=e.clientX;el._dy=e.clientY;});
    inner.addEventListener('click',ev=>{
      if(el._sup){el._sup=false;return;}
      if(ev.target.closest('[data-stop]')||ev.target.closest('mark')) return;
      const sel=window.getSelection();
      if(sel&&sel.toString().length>0) return;
      const dx=Math.abs(ev.clientX-(el._dx??ev.clientX)), dy=Math.abs(ev.clientY-(el._dy??ev.clientY));
      if(dx>6||dy>6) return;
      el.classList.toggle('flipped');
    });

    // select-to-highlight
    function addSel(span,lang){
      const sel=window.getSelection();
      if(!sel||sel.rangeCount===0||sel.isCollapsed) return false;
      const r=sel.getRangeAt(0);
      if(!span.contains(r.startContainer)||!span.contains(r.endContainer)) return false;
      let a=spanOffset(span,r.startContainer,r.startOffset), b=spanOffset(span,r.endContainer,r.endOffset);
      if(a>b)[a,b]=[b,a];
      if(b-a<1) return false;
      const hl=getHL(c.id); hl[lang]=mergeRanges([...hl[lang],[a,b]]); setHL(c.id,hl);
      sel.removeAllRanges(); paint(); return true;
    }
    enSpan.addEventListener('mouseup',()=>{ if(addSel(enSpan,'en')) el._sup=true; });
    viSpan.addEventListener('mouseup',()=>{ if(addSel(viSpan,'vi')) el._sup=true; });
    // touch: selection settles after the touchend event, so defer a tick before reading it
    enSpan.addEventListener('touchend',()=>setTimeout(()=>{ if(addSel(enSpan,'en')) el._sup=true; },0));
    viSpan.addEventListener('touchend',()=>setTimeout(()=>{ if(addSel(viSpan,'vi')) el._sup=true; },0));
    el.querySelector('.def').addEventListener('click',ev=>{
      const m=ev.target.closest('mark'); if(!m) return;
      ev.stopPropagation(); el._sup=true;
      const span=m.parentElement, lang=span.classList.contains('en')?'en':'vi';
      const a=+m.dataset.s, b=+m.dataset.e;
      const hl=getHL(c.id); hl[lang]=hl[lang].filter(r=>!(r[0]===a&&r[1]===b)); setHL(c.id,hl); paint();
    });

    el.querySelectorAll('.sbtn').forEach(btn=>btn.onclick=e=>{
      e.stopPropagation();
      const a=btn.dataset.act, cur=st(c.id), ns={...cur};
      if(a==='clr'){ setHL(c.id,{en:[],vi:[]}); paint(); return; }
      if(a==='k') ns.s=ns.s==='k'?null:'k';
      if(a==='u') ns.s=ns.s==='u'?null:'u';
      state[c.id]=ns; save(); updateStats();
      btn.parentElement.querySelector('.k').classList.toggle('on',ns.s==='k');
      btn.parentElement.querySelector('.u').classList.toggle('on',ns.s==='u');
      if(statusFilter!=='all') render();
    });
    const ta=el.querySelector('.note');
    ta.addEventListener('input',()=>{const cur=st(c.id);state[c.id]={...cur,n:ta.value};save();});
    deck.appendChild(el);
  });
  $('#count').textContent=`${list.length} / ${cards.length} cards`;
  updateStats();
}

function updateStats(){
  let k=0,u=0;
  cards.forEach(c=>{const s=st(c.id).s; if(s==='k')k++; else if(s==='u')u++;});
  $('#pk').textContent='Known '+k;
  $('#pu').textContent='Learning '+u;
  const pct=Math.round(k/cards.length*100);
  $('#barfill').style.width=pct+'%';
  $('#pct').textContent=pct+'%';
}

function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

const searchEl=$('#search'); searchEl.value=q;
searchEl.addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();saveUI();render();});
const filterEl=$('#filterStatus'); filterEl.value=statusFilter;
filterEl.addEventListener('change',e=>{statusFilter=e.target.value;saveUI();render();});
$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}render();};
$('#reset').onclick=()=>{if(confirm('Xoá toàn bộ tiến độ, ghi chú và tô sáng? / Clear all progress, notes and highlights?')){state={};save();render();}};
$('#flipall').onclick=()=>{allFlipped=!allFlipped;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('flipped',allFlipped));
  $('#flipall').textContent=allFlipped?'🙈 Ẩn nghĩa':'👁 Hiện nghĩa';};

// language toggle
let langIdx=parseInt(localStorage.getItem('cfa_lang_idx')||'0');
function applyLang(){const m=langCycle[langIdx];document.body.setAttribute('data-lang',m);$('#lang').textContent=langLabel[m];}
$('#lang').onclick=()=>{langIdx=(langIdx+1)%langCycle.length;localStorage.setItem('cfa_lang_idx',langIdx);applyLang();};
applyLang();

// theme
const savedTheme=localStorage.getItem('cfa_theme')||'light';
if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');$('#theme').textContent='☀️ Light';}
$('#theme').onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark){document.documentElement.removeAttribute('data-theme');$('#theme').textContent='🌙 Dark';localStorage.setItem('cfa_theme','light');}
  else{document.documentElement.setAttribute('data-theme','dark');$('#theme').textContent='☀️ Light';localStorage.setItem('cfa_theme','dark');}
};

render();
</script>
</body>
</html>
